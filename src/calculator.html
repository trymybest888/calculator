<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เครื่องคิดเลข</title>
<style>
  :root {
    --bg: #eef1f5;
    --panel: #ffffff;
    --text: #1d2330;
    --muted: #7a8394;
    --key: #f3f5f8;
    --key-hover: #e6eaf0;
    --op: #dfe8ff;
    --op-text: #2f5bd3;
    --accent: #2f5bd3;
    --accent-text: #ffffff;
    --danger: #c0392b;
    --shadow: 0 10px 30px rgba(20, 30, 60, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --panel: #1c2029;
      --text: #e9edf4;
      --muted: #8a93a5;
      --key: #262b36;
      --key-hover: #303644;
      --op: #24324f;
      --op-text: #9fb8ff;
      --accent: #4d78f0;
      --danger: #ff6b5b;
      --shadow: 0 10px 30px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
  }
  .calc {
    width: 100%;
    max-width: 340px;
    background: var(--panel);
    border-radius: 20px;
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .display {
    min-height: 96px;
    padding: 8px 4px 16px;
    text-align: right;
    overflow: hidden;
  }
  .preview {
    min-height: 1.4em;
    color: var(--muted);
    font-size: 1rem;
  }
  .expr {
    font-size: 2.4rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    word-break: break-all;
    line-height: 1.15;
  }
  .expr.error { color: var(--danger); }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    height: 60px;
    border: 0;
    border-radius: 14px;
    background: var(--key);
    color: var(--text);
    font: inherit;
    font-size: 1.35rem;
    cursor: pointer;
    transition: background .12s, transform .06s;
  }
  button:hover { background: var(--key-hover); }
  button:active, button.pressed { transform: scale(.96); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.op { background: var(--op); color: var(--op-text); }
  button.fn { color: var(--muted); }
  button.eq { background: var(--accent); color: var(--accent-text); }
  button.wide { grid-column: span 2; }
  .history {
    margin-top: 18px;
    border-top: 1px solid var(--key-hover);
    padding-top: 12px;
  }
  .history-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--muted);
    font-size: .9rem;
  }
  .history-head button {
    height: auto;
    padding: 4px 10px;
    font-size: .85rem;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
  }
  .history-head button:hover { background: var(--key); }
  .history ul {
    list-style: none;
    margin: 8px 0 0;
    padding: 0;
    max-height: 220px;
    overflow-y: auto;
  }
  .history li button {
    width: 100%;
    height: auto;
    padding: 8px 10px;
    border-radius: 10px;
    background: transparent;
    text-align: right;
    font-size: 1rem;
    font-variant-numeric: tabular-nums;
    word-break: break-all;
  }
  .history li button:hover { background: var(--key); }
  .history .h-expr { display: block; color: var(--muted); font-size: .85rem; }
  .history .empty { color: var(--muted); font-size: .9rem; text-align: center; padding: 12px 0; }
</style>
</head>
<body>
<main class="calc" aria-label="เครื่องคิดเลข">
  <div class="display" aria-live="polite">
    <div class="preview" id="preview" data-testid="preview"></div>
    <div class="expr" id="expr" data-testid="display">0</div>
  </div>
  <div class="keys">
    <button class="fn" data-key="C" aria-label="ล้าง">C</button>
    <button class="fn" data-key="Backspace" aria-label="ลบ">⌫</button>
    <button class="fn" data-key="%">%</button>
    <button class="op" data-key="/" aria-label="หาร">÷</button>
    <button data-key="7">7</button>
    <button data-key="8">8</button>
    <button data-key="9">9</button>
    <button class="op" data-key="*" aria-label="คูณ">×</button>
    <button data-key="4">4</button>
    <button data-key="5">5</button>
    <button data-key="6">6</button>
    <button class="op" data-key="-" aria-label="ลบ">−</button>
    <button data-key="1">1</button>
    <button data-key="2">2</button>
    <button data-key="3">3</button>
    <button class="op" data-key="+" aria-label="บวก">+</button>
    <button class="wide" data-key="0">0</button>
    <button data-key=".">.</button>
    <button class="eq" data-key="=" aria-label="เท่ากับ">=</button>
  </div>
  <section class="history" aria-label="ประวัติการคำนวณ">
    <div class="history-head">
      <span>ประวัติ</span>
      <button id="clear-history" data-testid="clear-history">ล้างประวัติ</button>
    </div>
    <ul id="history-list" data-testid="history"></ul>
  </section>
</main>

<!-- Pure logic (no DOM) — tests/calculator.test.js loads this block by its id. -->
<script id="calc-core">
const CalcCore = (() => {
  const OPS = '+-*/';

  function tokenize(expr) {
    const tokens = [];
    const re = /\s*(?:(\d+\.?\d*(?:e[+-]?\d+)?|\.\d+)|([+\-*/%()]))/y;
    let pos = 0;
    while (pos < expr.length) {
      re.lastIndex = pos;
      const m = re.exec(expr);
      if (!m) throw new Error('Unexpected character at ' + pos);
      tokens.push(m[1] !== undefined ? { type: 'num', value: parseFloat(m[1]) } : { type: 'op', value: m[2] });
      pos = re.lastIndex;
    }
    return tokens;
  }

  // Recursive descent: expr = term (+|- term)*, term = factor (*|/ factor)*,
  // factor = (+|-) factor | primary %?, primary = number | ( expr )
  function evaluate(expr) {
    const tokens = tokenize(expr);
    let i = 0;
    const peek = () => tokens[i] && tokens[i].type === 'op' ? tokens[i].value : null;

    function parseExpr() {
      let v = parseTerm();
      while (peek() === '+' || peek() === '-') {
        const op = tokens[i++].value;
        const r = parseTerm();
        v = op === '+' ? v + r : v - r;
      }
      return v;
    }
    function parseTerm() {
      let v = parseFactor();
      while (peek() === '*' || peek() === '/') {
        const op = tokens[i++].value;
        const r = parseFactor();
        if (op === '/' && r === 0) throw new Error('Division by zero');
        v = op === '*' ? v * r : v / r;
      }
      return v;
    }
    function parseFactor() {
      if (peek() === '-') { i++; return -parseFactor(); }
      if (peek() === '+') { i++; return parseFactor(); }
      let v = parsePrimary();
      while (peek() === '%') { i++; v /= 100; }
      return v;
    }
    function parsePrimary() {
      const t = tokens[i++];
      if (!t) throw new Error('Unexpected end');
      if (t.type === 'num') return t.value;
      if (t.value === '(') {
        const v = parseExpr();
        if (peek() !== ')') throw new Error('Missing )');
        i++;
        return v;
      }
      throw new Error('Unexpected ' + t.value);
    }

    if (tokens.length === 0) throw new Error('Empty');
    const result = parseExpr();
    if (i < tokens.length) throw new Error('Unexpected ' + tokens[i].value);
    return result;
  }

  // Round to 12 significant digits so 0.1 + 0.2 shows 0.3
  function format(n) {
    if (!Number.isFinite(n)) throw new Error('Not finite');
    const r = parseFloat(n.toPrecision(12));
    return String(Object.is(r, -0) ? 0 : r);
  }

  function calculate(expr) {
    try { return format(evaluate(expr)); } catch { return 'Error'; }
  }

  const lastNumber = (expr) => expr.match(/[\d.]*$/)[0];
  const stripTrailingOp = (expr) => OPS.includes(expr.slice(-1)) ? expr.slice(0, -1) : expr;

  // State reducer for key presses: { expr, fresh } where fresh = expr is a result just shown by "="
  function press(state, key) {
    let { expr, fresh } = state;
    if (key === 'C' || key === 'Escape') return { expr: '', fresh: false };
    if (expr === 'Error') { expr = ''; fresh = false; }
    if (key === 'Backspace') return { expr: fresh ? '' : expr.slice(0, -1), fresh: false };

    if (/^\d$/.test(key)) {
      if (fresh) expr = '';
      if (expr.endsWith('%')) return { expr, fresh: false };
      if (lastNumber(expr) === '0') expr = expr.slice(0, -1);
      return { expr: expr + key, fresh: false };
    }
    if (key === '.') {
      if (fresh) expr = '';
      if (expr.endsWith('%')) return { expr, fresh: false };
      const n = lastNumber(expr);
      if (n.includes('.')) return { expr, fresh: false };
      return { expr: expr + (n === '' ? '0.' : '.'), fresh: false };
    }
    if (OPS.includes(key) && key.length === 1) {
      if (expr === '' || expr === '-') return { expr: key === '-' ? '-' : '', fresh: false };
      if (OPS.includes(expr.slice(-1))) return { expr: expr.slice(0, -1) + key, fresh: false };
      return { expr: expr + key, fresh: false };
    }
    if (key === '%') {
      return { expr: /[\d.]$/.test(expr) ? expr + '%' : expr, fresh: false };
    }
    if (key === '=' || key === 'Enter') {
      const e = stripTrailingOp(expr);
      if (e === '' || fresh) return { expr, fresh };
      const result = calculate(e);
      return { expr: result, fresh: true, entry: { expr: e, result } };
    }
    return { expr, fresh };
  }

  // Newest first; skips errors and no-op entries like "8 = 8"
  function addHistory(history, entry, max = 50) {
    if (!entry || entry.result === 'Error' || entry.expr === entry.result) return history;
    return [entry, ...history].slice(0, max);
  }

  // Live result shown above the expression while typing
  function preview(state) {
    if (state.fresh || !/[+\-*/%]/.test(state.expr.slice(1))) return '';
    const r = calculate(stripTrailingOp(state.expr));
    return r === 'Error' ? '' : '= ' + r;
  }

  const pretty = (expr) => expr.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−');

  return { tokenize, evaluate, format, calculate, press, addHistory, preview, pretty };
})();
</script>

<script>
(() => {
  const exprEl = document.getElementById('expr');
  const previewEl = document.getElementById('preview');
  const historyEl = document.getElementById('history-list');
  const HISTORY_KEY = 'calc-history';
  let state = { expr: '', fresh: false };
  let history = loadHistory();

  function loadHistory() {
    try {
      const data = JSON.parse(localStorage.getItem(HISTORY_KEY));
      return Array.isArray(data) ? data.filter((h) => h && typeof h.expr === 'string' && typeof h.result === 'string') : [];
    } catch { return []; }
  }
  function saveHistory() {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch {}
  }

  function render() {
    exprEl.textContent = state.expr === '' ? '0' : CalcCore.pretty(state.expr);
    exprEl.classList.toggle('error', state.expr === 'Error');
    previewEl.textContent = CalcCore.preview(state);
  }

  function renderHistory() {
    historyEl.replaceChildren();
    if (history.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'ยังไม่มีประวัติ';
      historyEl.append(li);
      return;
    }
    history.forEach((h, i) => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.dataset.index = i;
      btn.title = 'ใช้ผลลัพธ์นี้';
      const exprSpan = document.createElement('span');
      exprSpan.className = 'h-expr';
      exprSpan.textContent = CalcCore.pretty(h.expr) + ' =';
      btn.append(exprSpan, CalcCore.pretty(h.result));
      li.append(btn);
      historyEl.append(li);
    });
  }

  function handle(key) {
    state = CalcCore.press(state, key);
    const next = CalcCore.addHistory(history, state.entry);
    if (next !== history) { history = next; saveHistory(); renderHistory(); }
    render();
  }

  // Click a history entry to load its result and keep calculating from it
  historyEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-index]');
    if (!btn) return;
    state = { expr: history[btn.dataset.index].result, fresh: true };
    render();
  });

  document.getElementById('clear-history').addEventListener('click', () => {
    history = [];
    saveHistory();
    renderHistory();
  });

  document.querySelector('.keys').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-key]');
    if (btn) handle(btn.dataset.key);
  });

  const KEY_ALIASES = { x: '*', X: '*', '×': '*', '÷': '/', Delete: 'C' };
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const key = KEY_ALIASES[e.key] || e.key;
    if (!/^[\d.+\-*/%=]$|^(Enter|Backspace|Escape|C|c)$/.test(key)) return;
    e.preventDefault();
    const norm = key === 'c' ? 'C' : key;
    handle(norm);
    const btn = document.querySelector(`button[data-key="${norm === 'Enter' ? '=' : norm === 'Escape' ? 'C' : norm}"]`);
    if (btn) { btn.classList.add('pressed'); setTimeout(() => btn.classList.remove('pressed'), 100); }
  });

  render();
  renderHistory();
})();
</script>
</body>
</html>
